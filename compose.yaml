services:
  downloader:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/data
    mem_limit: 2g
    cpus: 2
    # Private sessions: mount your owner-only session file read-only, and
    # set COOKIE_FILE=/run/secrets/youtube-session.txt in .env.
    # volumes:
    #   - media:/data
    #   - ./private/youtube-session.txt:/run/secrets/youtube-session.txt:ro
volumes:
  media:
